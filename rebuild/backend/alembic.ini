[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 注意：不在此处写 sqlalchemy.url —— 数据源唯一来自环境变量 DATABASE_URL，
# 由 alembic/env.py 从 app.core.settings 读取（坑 2 防护）。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
